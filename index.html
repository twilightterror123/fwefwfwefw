<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twilight Linux Desktop</title><style>:root{--bg:#090d12;--panel:rgba(17,22,29,.92);--text:#eef3f8;--muted:#8c99a7;--accent:#65d6ff;--border:rgba(255,255,255,.09);--shadow:0 22px 60px #0009}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 15%,#18313e,transparent 35%),radial-gradient(circle at 80% 80%,#17232e,transparent 35%),linear-gradient(135deg,#080b0f,#111821);color:var(--text)}button{font:inherit;color:inherit;border:0;background:none}.topbar{height:34px;background:#05080ccc;backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);font-size:13px}.brand{font-weight:700;margin-right:18px}.status{margin-left:auto;color:var(--muted)}#workspace{position:absolute;inset:34px 0 68px}.dock{position:absolute;left:14px;bottom:10px;display:flex;gap:7px;padding:7px 9px;background:#0f141be0;backdrop-filter:blur(22px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);z-index:999}.dock button{width:42px;height:42px;border-radius:11px;cursor:pointer;font-size:21px;transition:.18s}.dock button:hover{background:#ffffff19;transform:translateY(-4px)}.sep{width:1px;height:28px;background:var(--border);margin:7px 2px}.window{position:absolute;width:620px;min-width:320px;min-height:220px;background:#131820f2;backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:open .28s cubic-bezier(.2,.8,.2,1)}@keyframes open{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-.7deg) scale(1.006)}75%{transform:rotate(.7deg) scale(1.006)}}.wobble{animation:wobble .42s ease}.titlebar{height:42px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--border);cursor:grab}.dots{display:flex;gap:7px}.dot{width:12px;height:12px;border-radius:50%;background:#66707c;cursor:pointer}.title{margin:auto;font-size:13px;font-weight:600}.content{padding:18px;height:calc(100% - 42px);overflow:auto}.terminal{font-family:ui-monospace,monospace;font-size:13px;line-height:1.65}.prompt{color:var(--accent)}.menu,.settings{position:absolute;bottom:68px;background:#0f141bf7;backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:15px;padding:10px;box-shadow:var(--shadow);z-index:1000;animation:open .2s}.menu{left:14px;width:310px}.settings{right:16px;width:280px}.menu h3{margin:8px 10px;color:var(--muted);font-size:13px}.app{display:flex;align-items:center;gap:12px;padding:11px;border-radius:10px;cursor:pointer}.app:hover{background:#fff1}.app b{font-size:14px}.app small{display:block;color:var(--muted)}.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.switch{width:44px;height:24px;border-radius:99px;background:#38424d;padding:3px;cursor:pointer}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(20px)}.hint{position:absolute;right:15px;bottom:15px;color:#687482;font-size:11px}</style></head><body><header class="topbar"><span class="brand">☁ Twilight Linux</span><span>Desktop</span><span class="status" id="clock"></span></header><main id="workspace"></main><div class="dock"><button onclick="toggleMenu()">◉</button><div class="sep"></div><button onclick="openTerminal()">⌘</button><button onclick="openFiles()">▣</button><button onclick="openBrowser()">◎</button><button onclick="toggleSettings()">⚙</button></div><div class="menu" id="menu" hidden><h3>APPLICATIONS</h3><div class="app" onclick="openTerminal();toggleMenu()"><span>⌘</span><div><b>Terminal</b><small>Command line</small></div></div><div class="app" onclick="openFiles();toggleMenu()"><span>▣</span><div><b>Files</b><small>File manager</small></div></div><div class="app" onclick="openBrowser();toggleMenu()"><span>◎</span><div><b>Browser</b><small>Web browser</small></div></div></div><div class="settings" id="settings" hidden><h3>Desktop settings</h3><div class="toggle"><span>Window wobble</span><div class="switch on" id="wobbleSwitch" onclick="toggleWobble()"><i></i></div></div><div class="toggle"><span>Glass effects</span><div class="switch on"><i></i></div></div><div class="toggle"><span>Remember layout</span><div class="switch on"><i></i></div></div><small style="color:#7f8b98">Lokal gespeichert</small></div><div class="hint">Twilight Desktop • drag windows</div><script>const ws=document.getElementById('workspace');let z=10,wobble=localStorage.getItem('wobble')!=='false';document.getElementById('wobbleSwitch').classList.toggle('on',wobble);function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}setInterval(clock,1000);clock();function toggleMenu(){menu.hidden=!menu.hidden}function toggleSettings(){settings.hidden=!settings.hidden}function toggleWobble(){wobble=!wobble;wobbleSwitch.classList.toggle('on',wobble);localStorage.setItem('wobble',wobble)}function focus(e){e.style.zIndex=++z;if(wobble){e.classList.remove('wobble');void e.offsetWidth;e.classList.add('wobble')}}function closeWin(id){document.getElementById(id)?.remove();save()}function win(title,html,x,y,w,h,id){if(document.getElementById(id)){focus(document.getElementById(id));return}let e=document.createElement('section');e.className='window';e.id=id;e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++z}`;e.innerHTML=`<div class="titlebar"><div class="dots"><button class="dot" onclick="closeWin('${id}')"></button></div><div class="title">${title}</div><button onclick="closeWin('${id}')">×</button></div><div class="content">${html}</div>`;ws.appendChild(e);drag(e);focus(e);save()}function drag(e){let b=e.querySelector('.titlebar'),sx,sy,ox,oy,d=false;b.onmousedown=a=>{d=true;sx=a.clientX;sy=a.clientY;ox=e.offsetLeft;oy=e.offsetTop;focus(e)};onmousemove=a=>{if(d){e.style.left=Math.max(0,ox+a.clientX-sx)+'px';e.style.top=Math.max(0,oy+a.clientY-sy)+'px'}};onmouseup=()=>{d=false;save()}}function openTerminal(){win('Terminal — twilight',`<div class="terminal"><span class="prompt">twilight@penguin</span>:~$ neofetch<br><br>OS: Debian GNU/Linux<br>Desktop: Twilight Linux<br>Effects: ON<br>Status: READY<br><br><span class="prompt">twilight@penguin</span>:~$ echo "TWILIGHT LINUX READY"<br>TWILIGHT LINUX READY<br><br><span class="prompt">twilight@penguin</span>:~$ _</div>`,80,55,620,380,'terminal')}function openFiles(){win('Files',`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font-size:30px">📁<small>Home</small>　📁<small>Downloads</small>　📁<small>Projects</small><br>📄<small>README.md</small>　⚙️<small>Settings</small></div>`,150,85,520,330,'files')}function openBrowser(){win('Browser',`<div style="height:100%"><div style="background:#0d131a;border:1px solid var(--border);border-radius:8px;padding:9px;color:#82909d">🔒 twilight://start</div><h1>Twilight Linux</h1><p style="color:#9ba7b3">Linux-inspired desktop experience.</p></div>`,210,65,650,390,'browser')}function save(){localStorage.setItem('layout',JSON.stringify([...document.querySelectorAll('.window')].map(e=>({id:e.id,left:e.style.left,top:e.style.top,width:e.style.width,height:e.style.height}))))}function restore(){try{let a=JSON.parse(localStorage.getItem('layout')||'[]');a.forEach(o=>{if(o.id==='terminal')openTerminal();if(o.id==='files')openFiles();if(o.id==='browser')openBrowser();let e=document.getElementById(o.id);if(e){e.style.left=o.left;e.style.top=o.top;e.style.width=o.width;e.style.height=o.height}})}catch{}}restore();</script></body></html>
